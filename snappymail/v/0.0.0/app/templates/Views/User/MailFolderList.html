<div class="b-folders g-ui-user-select-none">
	<div class="b-toolbar btn-toolbar">
		<a class="btn buttonCompose" data-bind="click: composeClick, css: {'btn-warning': composeInEdit, 'btn-success': !composeInEdit()}" data-i18n="[title]FOLDER_LIST/BUTTON_NEW_MESSAGE">
			<i class="icon-paper-plane"></i>
			<span class="buttonComposeText" data-i18n="FOLDER_LIST/BUTTON_NEW_MESSAGE"></span>
		</a>
		<a class="btn buttonContacts fontastic" data-bind="visible: allowContacts, click: contactsClick" data-i18n="[title]GLOBAL/CONTACTS">📇</a>
	</div>
	<div class="b-content" data-bind="i18nUpdate: i18nTrigger">
		<!-- ko if: multiAccount -->
		<ul class="b-folders-unified">
			<li>
				<a class="b-unified selectable" href="#" data-icon="📥" data-bind="css: {'selected': unified.active}, attr: {'data-unread': unified.unreadCount}">
					<span data-i18n="FOLDER_LIST/UNIFIED_INBOX"></span>
				</a>
			</li>
		</ul>
		<div class="b-accounts-head">
			<span class="b-accounts-title" data-i18n="FOLDER_LIST/ACCOUNTS"></span>
			<a href="#" class="b-accounts-toggle" data-bind="click: toggleAllAccounts, text: toggleAllAccountsLabel"></a>
		</div>
		<!-- /ko -->
		<div class="b-accounts" data-bind="css: {'multi': multiAccount}, foreach: accountList">
		<div class="b-account" data-bind="css: {'expanded': expanded, 'active': isActive}">
			<!-- ko if: $root.multiAccount -->
			<a class="b-account-header" href="#" data-bind="attr: {title: email, 'aria-expanded': expanded() ? 'true' : 'false', 'aria-label': ariaLabel, 'data-unread': collapsedUnread}">
				<i class="e-collapsed-sign" data-bind="css: expanded() ? 'icon-down-mini' : 'icon-right-mini'"></i>
				<!-- ko text: label() --><!-- /ko -->
			</a>
			<!-- /ko -->
			<!-- ko if: isActive() && expanded() -->
			<ul class="b-folders-system" data-bind="foreach: $root.systemFolders">
				<li>
					<a data-bind="dropmessages: $data,
						css: { 'selected': selected, 'selectable': selectable, 'anim-action-class': actionBlink, 'is-flagged': isFlagged },
						attr: { 'data-icon': icon, 'data-unread': unreadCount }">
						<!-- ko text: localName --><!-- /ko -->
						<!-- ko if: isInbox -->
						<span class="flag-icon fontastic"></span>
						<!-- /ko -->
					</a>
				</li>
			</ul>
			<hr>
			<div class="search-input-wrp" data-bind="visible: $root.foldersFilterVisible">
				<input type="search" id="folderSearchInput" data-bind="textInput: $root.foldersFilter" data-i18n="[placeholder]GLOBAL/SEARCH">
				<a data-bind="click: $root.clearFolderSearch, visible: $root.foldersFilter">✕</a>
			</div>
			<div class="e-checkbox" tabindex="0" data-bind="toggle: $root.filterUnseen">
				<i role="checkbox" class="fontastic" data-bind="text: $root.filterUnseen() ? '☑' : '☐'"></i>
				<span data-i18n="SEARCH/UNSEEN"></span>
			</div>
			<ul class="b-folders-user" data-bind="css: {unreadOnly: $root.filterUnseen}, template: { name: 'MailFolderListItem', foreach: $root.folderListVisible }"></ul>
			<!-- /ko -->
			<!-- ko if: !isActive() && expanded() -->
			<ul class="b-account-folders">
				<!-- ko if: foldersLoading -->
				<li class="b-account-status" data-i18n="GLOBAL/LOADING"></li>
				<!-- /ko -->
				<!-- ko if: foldersError -->
				<li class="b-account-status" data-i18n="FOLDER_LIST/FOLDERS_LOAD_ERROR"></li>
				<!-- /ko -->
				<!-- ko foreach: folders -->
				<li><a class="b-account-folder" href="#" data-bind="css: {'selectable': selectable}, attr: {'data-unread': unreadEmails}, style: {textIndent: depth + 'em'}, text: name"></a></li>
				<!-- /ko -->
			</ul>
			<!-- /ko -->
		</div>
		</div>
		<div class="move-action-content-wrapper" data-bind="visible: moveAction"></div>
	</div>
	<div class="b-footer btn-toolbar">
		<div class="btn-group">
			<a class="btn fontastic toggleLeft" data-bind="click: toggleLeftPanel"></a>
		</div>
		<div class="btn-group hide-on-panel-disabled">
			<a class="btn icon-folder-add" data-bind="click: createFolder" data-i18n="[title]POPUPS_CREATE_FOLDER/TITLE_CREATE_FOLDER"></a>
			<a class="btn fontastic" data-bind="click: configureFolders" data-i18n="[title]SETTINGS_LABELS/FOLDERS">⚙</a>
		</div>
	</div>
</div>
