name: docker-pr

on:
  pull_request:
    branches:
    - master

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Each platform is built and tested natively on its own runner, nothing is pushed
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Prepare
      run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      env:
        PLATFORM: ${{ matrix.platform }}

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: ${{ matrix.platform }}
        load: true
        tags: snappymail:test
        labels: |
          org.opencontainers.image.description=SnappyMail
          org.opencontainers.image.licenses=AGPLv3
        cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

    - name: Install container-structure-test
      run: |
        ARCH=$( dpkg --print-architecture )
        curl -fsSL -o "$RUNNER_TEMP/container-structure-test" "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-${ARCH}"
        chmod +x "$RUNNER_TEMP/container-structure-test"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      env:
        CST_VERSION: v1.19.3

    - name: Test
      run: .docker/release/test/test.sh snappymail:test
