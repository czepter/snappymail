name: docker-pr

on:
  pull_request:
    branches:
    - master

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # This step generates the docker tags
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      env:
        # This env var ensures {{sha}} is a real commit SHA for type=ref,event=pr
        DOCKER_METADATA_PR_HEAD_SHA: 'true'
      with:
        images: ghcr.io/${{ github.repository }}
        # type=ref,event=pr generates tag(s) on PRs only. E.g. 'pr-123', 'pr-123-abc0123'
        tags: |
          type=ref,event=pr
          type=ref,suffix=-{{sha}},event=pr
        # The rest of the org.opencontainers.image.xxx labels are dynamically generated
        labels: |
          org.opencontainers.image.description=SnappyMail
          org.opencontainers.image.licenses=AGPLv3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: linux/amd64
        load: true
        tags: snappymail:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test
      run: .docker/release/test/test.sh snappymail:test

    - name: Build all archs
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: linux/386,linux/amd64,linux/arm64
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
