name: docker

on:
  push:
    branches:
    - master
    tags:
    - 'v*'
  workflow_dispatch:

# This is needed to push to GitHub Container Registry. See https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # This step generates the docker tags
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Docker Hub is only used when the repository variable DOCKERHUB_IMAGE is set (e.g. 'user/snappymail')
        images: |
          ghcr.io/${{ github.repository }}
          ${{ vars.DOCKERHUB_IMAGE }}
        # type=ref,event=branch generates tag(s) on branch only. E.g. 'master'
        # type=raw,value=latest generates 'latest' on the default branch only
        # type=semver generates tag(s) on tags only. E.g. 'v2.1.0' -> '2.1.0', '2.1'
        # type=sha generates e.g. 'sha-abc0123'
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
        # The rest of the org.opencontainers.image.xxx labels are dynamically generated
        labels: |
          org.opencontainers.image.description=SnappyMail
          org.opencontainers.image.licenses=AGPLv3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub registry
      if: vars.DOCKERHUB_IMAGE != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build for the runner's architecture first and test it before pushing anything
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: linux/amd64
        load: true
        tags: snappymail:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test
      run: .docker/release/test/test.sh snappymail:test

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: linux/386,linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
