name: docker

on:
  release:
    types:
    - published
  # Rebuild the images of an existing release: run it on the release tag
  workflow_dispatch:

# This is needed to push to GitHub Container Registry. See https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each platform is built natively on its own runner and pushed by digest only,
  # the 'merge' job then combines the digests into one multi-arch manifest.
  # See: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: linux/amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Prepare
      run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      env:
        PLATFORM: ${{ matrix.platform }}

    - name: Checkout
      uses: actions/checkout@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        labels: |
          org.opencontainers.image.description=SnappyMail
          org.opencontainers.image.licenses=AGPLv3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build and test the image before pushing anything
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: ${{ matrix.platform }}
        load: true
        tags: snappymail:test
        cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
        cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

    - name: Install container-structure-test
      run: |
        ARCH=$( dpkg --print-architecture )
        curl -fsSL -o "$RUNNER_TEMP/container-structure-test" "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-${ARCH}"
        chmod +x "$RUNNER_TEMP/container-structure-test"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      env:
        CST_VERSION: v1.19.3

    - name: Test
      run: .docker/release/test/test.sh snappymail:test

    - name: Push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

    - name: Export digest
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "$RUNNER_TEMP/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    # This step generates the docker tags. E.g. release 'v2.1.0' -> '2.1.0', '2.1', 'latest'
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Docker Hub is only used when the repository variable DOCKERHUB_IMAGE is set (e.g. 'user/snappymail')
        images: |
          ${{ env.IMAGE }}
          ${{ vars.DOCKERHUB_IMAGE }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub registry
      if: vars.DOCKERHUB_IMAGE != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: ${{ runner.temp }}/digests
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf "$IMAGE@sha256:%s " *)

    - name: Inspect image
      run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
