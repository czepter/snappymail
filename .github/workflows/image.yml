name: image

# Builds the release image (.docker/release/Dockerfile), tests it and pushes it
# to the GitHub Container Registry of this repository (ghcr.io/<owner>/<repo>).
on:
  push:
    branches:
    - master
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms (comma separated)'
        required: false
        default: 'linux/amd64'

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # master -> 'master', 'latest', 'sha-abc0123'
    # v1.2.3 -> '1.2.3', '1.2', 'sha-abc0123'
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
        labels: |
          org.opencontainers.image.description=SnappyMail
          org.opencontainers.image.licenses=AGPLv3

    - name: Set up QEMU
      if: env.PLATFORMS != 'linux/amd64'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build for the runner's architecture first and test it before pushing anything
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: linux/amd64
        load: true
        tags: snappymail:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test
      run: .docker/release/test/test.sh snappymail:test

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: '.'
        file: ./.docker/release/Dockerfile
        platforms: ${{ env.PLATFORMS }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
